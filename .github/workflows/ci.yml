name: CI

# CONTRIBUTING 写明「校验不通过的 PR 不会合并」——这里让它真正被执行，
# 而不是靠自觉。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 数据校验与生成物同步
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # ID 唯一、出处存在、交叉引用可解析、必填字段齐全、
      # 每份出处有 verifiedOn、英文与繁体层无漏译。
      - name: node tools/validate.mjs
        run: node tools/validate.mjs

      # 监管关系分三类：Equivalent（实质等价，合并）、Overlaps（部分重叠）、Related（相关）。
      # 只有 data/equivalence.js 登记的等价组会合并为一张卡片，所以每组都必须通过
      # tools/lib/equivalence-rules.mjs 的规则（控制域、义务强度、截止日期一致，
      # 有原文依据，原文相同或经人工评审并写明理由等）。不通过的组请改为 overlaps 或 related。
      - name: 等价性规则检查
        run: node tools/check-equivalence.mjs

      # 引擎逻辑与等价性规则的单元测试（零依赖，Node 内置 test runner）。
      - name: node --test
        run: node --test tests/*.test.mjs

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: 安装 OpenCC
        run: pip install --quiet opencc-python-reimplemented

      # 繁体层与繁体 README 都是生成物。若有人改了简体原文却忘了重新生成，
      # 繁体界面就会停留在旧文案——这一步把它变成显式失败。
      - name: 重新生成繁体层
        run: python3 tools/gen-hant.py

      - name: 确认生成物已提交且为最新
        run: |
          if ! git diff --exit-code -- data/i18n/zh-Hant.js README.zh-Hant.md; then
            echo ''
            echo '::error::繁体生成物与简体原文不同步。'
            echo '请在本地运行 python3 tools/gen-hant.py 并提交结果。'
            exit 1
          fi
